name: Posición al asignar proveedor
on:
  pull_request:
    paths:
      - 'ui.js'
      - 'estilos.css'
      - 'index.html'
      - 'tests/test_provider_scroll.py'
      - '.github/workflows/provider-scroll.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-scroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar la aplicación
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar navegador aislado
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Probar scroll en móvil y ordenador sin Firebase
        run: python tests/test_provider_scroll.py
