name: Tests ARSLAN LISTAS
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar y ejecutar todas las pruebas
        run: npm run check
      - name: Comprobar que el HTML publicado coincide con el código
        run: git diff --exit-code -- index.html
