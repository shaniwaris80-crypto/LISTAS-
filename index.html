/* ARSLAN iPHONE — Barra inferior táctil, 5 acciones claras, sin scroll horizontal */

.purchase-item .keynum{align-self:flex-start}

/* Compras manuales: selección reversible, completados abajo y controles táctiles iPhone */
.purchase-bulk{padding:10px 0 14px;border-bottom:1px solid #e8e8e8;margin:0 0 15px}
.purchase-bulk .tools{display:flex;flex-wrap:wrap;gap:8px}
.purchase-bulk details{margin-top:10px;border-top:1px solid #ececec;padding-top:9px}
.purchase-bulk summary{font-size:12px;color:#666;cursor:pointer;font-weight:750}
.purchase-item{align-items:flex-start;flex-wrap:wrap;gap:10px}
.purchase-item .grow{flex:1 1 160px;min-width:0}
.purchase-item.manual-complete{background:#f2fbf4;border-color:#b9dfc6}
.purchase-tick{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:#fff;border:2px solid #111;color:#111;display:grid;place-items:center;font-size:23px;font-weight:900;padding:0;cursor:pointer;touch-action:manipulation}
.purchase-tick.checked{border-color:#15803d;background:#15803d;color:white}
.purchase-tick:disabled{opacity:.35;cursor:not-allowed}
.purchase-controls{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.purchase-controls>label{width:100%;margin:0;font-size:12px;color:#444}
.purchase-qty-controls{display:flex;align-items:center;gap:5px;width:min(100%,218px)}
.purchase-qty-controls input{width:76px;min-width:0;text-align:center;font-size:17px;font-weight:850;height:46px;padding:8px;border:2px solid #aaa;border-radius:10px}
.qty-step{flex:0 0 46px;width:46px;height:46px;border:2px solid #161616;background:#fff;color:#111;border-radius:11px;font-size:24px;font-weight:900;cursor:pointer;touch-action:manipulation}
.qty-step:active{background:#e9e9e9}
.purchase-completed{margin-top:18px;border-color:#cde8d4}

.purchase-item> .btn{min-height:44px}
@media(max-width:425px){.purchase-item{gap:8px}.purchase-item .grow{flex:1 1 calc(100% - 130px)}.purchase-item>.btn{width:100%;flex:1 1 100%}.purchase-qty-controls{width:100%}.purchase-bulk .tools .btn{flex:1 1 125px;min-height:45px}}
/* Alineación estable de tarjetas en Safari iPhone, sin columnas estrechas. */
.purchase-item{display:grid;grid-template-columns:46px 44px minmax(0,1fr);align-items:start;column-gap:8px;row-gap:8px;min-width:0}
.purchase-item .purchase-tick{grid-column:1;grid-row:1}
.purchase-item .keynum{grid-column:2;grid-row:1;min-width:40px;max-width:100%;word-break:normal}
.purchase-item .grow{grid-column:3;grid-row:1;min-width:0;width:100%;flex:none;overflow-wrap:break-word}
.purchase-item>.btn{grid-column:1/-1;grid-row:auto;width:100%;min-width:0;margin-top:2px}

/* Progreso de reparto por tienda/restaurante (sin mezclar unidades de mercancía) */

function qtyRequested(state,key){return totals(state).find(t=>sameProductKey(state,t.key,key))?.total||0;}
function fix(n){return Math.round((Number(n)||0)*1000)/1000;}
function assignSupplier(state,key,supplier,quantity){if(!SUPPLIERS.includes(supplier))throw Error('Proveedor desconocido');const row=totals(state).find(t=>t.key===key);if(!row)throw Error('Producto inexistente');if(row.unresolved)throw Error('Revisa el nombre en rojo antes de asignar');
 const q=quantity??row.total; if(!(q>0))throw Error('Cantidad no válida');
 // Prevent multiple draft assignments that exceed requested qty (extra requires separate manual purchase).

 const others=active.reduce((s,a)=>s+a.q,0)-(existing?.q||0);
 if(others+q>row.total+1e-8)throw Error('La asignación supera la cantidad pedida');

function moveDraftToSupplier(state,key,supplier){
 const active=state.allocations.filter(a=>sameProductKey(state,a.key,key)&&a.status!=='cancelled');
 if(active.some(a=>a.status==='sent'))throw Error('Este producto ya se envió: corrige el pedido en vez de moverlo silenciosamente');

 return assignSupplier(state,key,supplier,qtyRequested(state,key));
}
function supplierLines(state,supplier,includeSent=true){return state.allocations.filter(a=>a.supplier===supplier&&a.status!=='cancelled'&&(includeSent||a.status==='draft')).map(a=>({ ...a,product:normalizedProductName(a.key.split('|')[0],state) })).sort((a,b)=>a.product.localeCompare(b.product,'es',{numeric:true}));}
const qtyLabel=n=>String(n).replace('.',',');
function combinedSupplierTXT(lines,state){
 const map=new Map();for(const a of lines){const key=normalizedProductKey(state,a.key),old=map.get(key);
  if(old)old.q=fix(old.q+a.q);else map.set(key,{name:normalizedProductName(a.product,state),q:fix(a.q)});}

}
function supplierTXT(state,supplier){return combinedSupplierTXT(supplierLines(state,supplier),state);}
function prepareWhatsApp(state,supplier){return {supplier,text:supplierTXT(state,supplier),url:`https://wa.me/?text=${encodeURIComponent('PEDIDO '+supplier+'\n'+supplierTXT(state,supplier))}`};}
/** Sólo los productos que aún no han sido enviados: previene reenviar un pedido antiguo. */
function supplierDraftTXT(state,supplier){return combinedSupplierTXT(supplierLines(state,supplier,false),state);}
function supplierDraftWhatsApp(state,supplier){const text=supplierDraftTXT(state,supplier);return {supplier,text,url:text?`https://wa.me/?text=${encodeURIComponent('PEDIDO '+supplier+'\n'+text)}`:''};}
/** Un pedido individual es independiente y forma parte del total Global sólo cuando contiene líneas. */
function destinationLines(state,dest){

 const map=new Map();
 for(const line of state.orders.filter(l=>l.dest===dest&&l.q>0)){
  const product=normalizedProductName(line.product,state),key=canonical(product)+'|'+line.unit;
  const old=map.get(key);

}
function destinationTXT(state,dest){return destinationLines(state,dest).map(l=>`${qtyLabel(l.q)}${display(l.product)}`).join('\n');}
function destinationWhatsApp(state,dest){const d=state.destinations.find(x=>x.id===dest);if(!d)throw Error('Destino desconocido');const text=destinationTXT(state,dest);return {text,url:text?`https://wa.me/?text=${encodeURIComponent('PEDIDO '+display(d.name)+'\n'+text)}`:''};}
/** Conservar el Global completo, pero sacar lo asignado de la bandeja rápida de asignación. */
function unassignedProducts(state){return totals(state).filter(r=>{

/** Volver a preparar un envío marcado por error, sólo si no se ha empezado a bajarlo. */
function reopenSupplierSent(state,supplier){

}

function markSupplierSent(state,supplier){const lines=supplierLines(state,supplier,false);if(!lines.length)throw Error('No hay líneas nuevas para enviar');const packet={id:id('envio'),supplier,text:combinedSupplierTXT(lines,state),timestamp:new Date().toISOString(),confirmedByUser:true,channel:'confirmacion-manual'};for(const a of state.allocations)if(a.supplier===supplier&&a.status==='draft')a.status='sent';state.sentMessages.push(packet);return packet;}
function manualBuy(state,key,q){const row=totals(state).find(t=>t.key===key);if(!row)throw Error('No existe producto');if(row.unresolved)throw Error('Confirma el producto antes de comprar');if(!(q>0))throw Error('Cantidad positiva requerida');state.manual.push({id:id('manual'),key,q:fix(q),confirmed:true});}
function receiveSupplier(state,allocationId,q){const a=state.allocations.find(x=>x.id===allocationId&&x.status==='sent');if(!a)throw Error('El pedido debe estar enviado');if(!(q>0))throw Error('Cantidad inválida');const previous=state.receipts.filter(x=>x.allocationId===allocationId).reduce((s,x)=>s+x.q,0);if(previous+q>a.q+1e-8)throw Error('No se recibe más de lo enviado sin registrar una compra extra');state.receipts.push({id:id('receipt'),allocationId,q:fix(q)});}
function authorizedQty(state,key){const sent=state.allocations.filter(a=>sameProductKey(state,a.key,key)&&a.status==='sent').reduce((s,a)=>s+a.q,0);const manual=state.manual.filter(m=>sameProductKey(state,m.key,key)&&m.confirmed).reduce((s,a)=>s+a.q,0);return fix(sent+manual);}
function actuallyReceived(state,key){const manual=state.manual.filter(m=>sameProductKey(state,m.key,key)&&m.confirmed).reduce((s,x)=>s+x.q,0);
 const received=state.receipts.filter(r=>sameProductKey(state,state.allocations.find(a=>a.id===r.allocationId)?.key,key)).reduce((s,x)=>s+x.q,0);return fix(manual+received);

/** Regla única de negocio usada por Global, Compras y Reparto.
 * Un borrador asignado NO autoriza bajadas. Un pedido realmente marcado
 * como enviado o una compra manual confirmada SÍ las autoriza.
 * La carga permanece completamente independiente.
 */
function productStatus(state,key){
 const requested=qtyRequested(state,key);
 const active=state.allocations.filter(a=>sameProductKey(state,a.key,key)&&a.status!=='cancelled');
 const assignedDraft=fix(active.filter(a=>a.status==='draft').reduce((sum,a)=>sum+a.q,0));
 const assignedSent=fix(active.filter(a=>a.status==='sent').reduce((sum,a)=>sum+a.q,0));
 const manuallyBought=fix(state.manual.filter(m=>sameProductKey(state,m.key,key)&&m.confirmed).reduce((sum,m)=>sum+m.q,0));
 const supplierReceived=fix(state.receipts.filter(r=>active.some(a=>a.id===r.allocationId)).reduce((sum,r)=>sum+r.q,0));
 const authorized=fix(assignedSent+manuallyBought);
 const status=authorized>0?'REPARTO_HABILITADO':assignedDraft>0?'ASIGNADO_SIN_ENVIAR':'SIN_GESTIONAR';
 return {requested,assignedDraft,assignedSent,manuallyBought,supplierReceived,authorized,status,remainingToAuthorize:fix(Math.max(0,requested-authorized)),extraPurchased:fix(Math.max(0,supplierReceived+manuallyBought-requested))};
}

/** Asignación rápida: una pulsación añade o mueve, y una segunda en el mismo
 * proveedor quita el borrador. Nunca borra ni cambia un envío confirmado.
 */
function quickAssign(state,key,supplier){
 const row=totals(state).find(t=>t.key===key);
 if(!row)throw Error('Producto no encontrado');
 if(row.unresolved)throw Error('Revisa el nombre en rojo antes de asignar');
 if(!SUPPLIERS.includes(supplier)||supplier==='COMPRA EXTERNA')throw Error('Selecciona un proveedor válido');
 const active=state.allocations.filter(a=>sameProductKey(state,a.key,key)&&a.status!=='cancelled');
 if(active.some(a=>a.status==='sent'))throw Error('Ya enviado: cualquier cambio requiere una corrección explícita');
 if(active.length&&active.every(a=>a.supplier===supplier&&a.status==='draft')){
  state.allocations=state.allocations.filter(a=>a.key!==key||a.status!=='draft');
  return 'DESASIGNADO';
 }
 const manual=productStatus(state,key).manuallyBought;
 const q=fix(row.total-manual);
 if(q<=0)throw Error('Ya está comprado manualmente: no dupliques la compra al asignar un proveedor');
 state.allocations=state.allocations.filter(a=>a.key!==key||a.status!=='draft');
 assignSupplier(state,key,supplier,q);

}

/** Compra separada de recepción de proveedor.
 * - Nunca registra la recepción de un proveedor existente.
 * - Si existe borrador de proveedor, necesita retirarlo expresamente.
 * - Si excede la cantidad pedida, necesita confirmación adicional.
 */
function manualBuySafe(state,key,q,{removeDraft=false,allowExtra=false}={}){
 const row=totals(state).find(t=>t.key===key);
 if(!row)throw Error('Producto no encontrado');
 if(row.unresolved)throw Error('Confirma el nombre en rojo antes de comprar');
 const qty=fix(Number(String(q).replace(',','.')));
 if(!(qty>0))throw Error('Cantidad de compra positiva requerida');
 const status=productStatus(state,key);
 const unassigned=fix(Math.max(0,row.total-status.authorized-status.assignedDraft));
 if(status.assignedDraft>0&&!removeDraft&&qty>unassigned+1e-8)throw Error('Existe pedido a proveedor sin enviar: no dupliques ese borrador. Retíralo antes de comprar su cantidad');
 const expected=fix(status.authorized+qty);
 if(expected>row.total+1e-8&&!allowExtra)throw Error('Compra superior al pedido: confirma expresamente la cantidad extra');
 if(removeDraft){
  // Reduce el borrador exactamente por la compra manual, sin borrar
  // silenciosamente los otros bultos que aún se esperan del proveedor.
  // Solo se retira del borrador la cantidad de compra que supera
  // lo que estaba libre, sin tocar otros bultos reservados al proveedor.
  let toReduce=fix(Math.max(0,qty-unassigned));
  for(const a of state.allocations.filter(a=>sameProductKey(state,a.key,key)&&a.status==='draft')){
   if(toReduce<=0)break;

}

/** Vista de control: la lista sin gestionar sigue visible en compras, aunque
 * Reparto únicamente reciba los autorizados.
 */
function pendingPurchases(state){

  const st=productStatus(state,row.key);
  // Cada cantidad se cuenta una sola vez: enviada a proveedor, reservada
  // en borrador o comprada manualmente. La recepción no crea una segunda compra.
  const supplierCovered=fix(st.assignedSent+st.assignedDraft);
  const remainingToBuy=fix(Math.max(0,row.total-supplierCovered-st.manuallyBought));
  return {...row,...st,supplierCovered,remainingToBuy};

}

/**
 * Deshacer una compra manual sin eliminar el historial. Cada reversión
 * crea una corrección negativa; los movimientos anteriores permanecen.
 * Nunca deja bajadas físicas sin cantidad habilitada.
 */
function checkManualPurchaseReversal(state,key,quantity){
 const st=productStatus(state,key);
 const qty=fix(Number(String(quantity).replace(',','.')));
 if(!Number.isFinite(qty)||qty<=0||qty>st.manuallyBought+1e-8)
  throw Error('Cantidad a deshacer inválida o superior a lo comprado manualmente');
 const after=fix(st.authorized-qty);
 const delivered=fix(Object.entries(state.delivery||{}).filter(([location,v])=>{const at=location.lastIndexOf('@');return at>=0&&sameProductKey(state,location.slice(0,at),key)&&Number(v)>0;}).reduce((n,[,v])=>n+Number(v),0));
 if(after+1e-8<delivered){
  const name=totals(state).find(x=>x.key===key)?.product||key;
  throw Error(`No puedes desmarcar ${name}: hay ${delivered} ya bajado y quedarían ${after} habilitados. Deshaz primero las bajadas que correspondan.`);

}
function reverseManualPurchase(state,key,quantity=null){

 const change=checkManualPurchaseReversal(state,key,quantity===null?bought:quantity);

}
/** Deshacer todas de forma atómica: si una afecta a bajadas, no modifica NINGUNA. */
function reverseAllManualPurchases(state){
 const rows=pendingPurchases(state).filter(row=>row.manuallyBought>0);
 if(!rows.length)throw Error('No hay compras manuales activas para deshacer');
 for(const row of rows)checkManualPurchaseReversal(state,row.key,row.manuallyBought);
 for(const row of rows)reverseManualPurchase(state,row.key,row.manuallyBought);

}
/** Guardar cantidad total comprada manualmente por producto (no el total del proveedor). */
function setManualPurchaseTotal(state,key,total,{allowExtra=false,removeDraft=false}={}){
 const n=fix(Number(String(total).replace(',','.')));
 if(!Number.isFinite(n)||n<0)throw Error('Introduce una cantidad válida, igual o mayor que cero');
 const current=productStatus(state,key).manuallyBought;
 if(n===current)return productStatus(state,key);
 if(n<current)return reverseManualPurchase(state,key,fix(current-n));

}
/** Sólo cantidades por comprar manualmente, nunca proveedores cubiertos ni duplicados. */
function pendingManualPurchaseTXT(state){
 return pendingPurchases(state).filter(r=>r.remainingToBuy>0&&!r.unresolved)
  .map(r=>`${qtyLabel(r.remainingToBuy)}${display(r.product)}`).join('\n');
}
function pendingManualPurchaseWhatsApp(state){
 const text=pendingManualPurchaseTXT(state);
 return {text,url:text?`https://wa.me/?text=${encodeURIComponent('COMPRAS MANUALES PENDIENTES\n'+text)}`:''};
}

const dOrder=(a,b)=>{const ai=STORE_ORDER.indexOf(a),bi=STORE_ORDER.indexOf(b);if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return -1;if(bi>=0)return 1;return a.localeCompare(b);};
function planShortage(state,key,by){
 const row=totals(state).find(t=>t.key===key);if(!row)throw Error('Producto no encontrado');
 const authorized=authorizedQty(state,key);let total=0;
 for(const [dest,rawQty] of Object.entries(by)){
  const q=num(rawQty);if(!Number.isFinite(q)||q<0)throw Error('Cantidad inválida');
  if(q>(row.by[dest]||0)+1e-8)throw Error('No se pueden asignar más de las cajas pedidas por tienda');
  if(q+(1e-8)<deliveredFor(state,key,dest))throw Error('No se puede quitar mercancía ya bajada');
  total+=q;
 }
 if(total>authorized+1e-8)throw Error('Se supera la mercancía habilitada');

 return state.shortageAllocation[key];
}
function deliveryPlan(state){const eligible=[],blocked=[],short=[],needsReview=[];let all=totals(state);
 for(const t of all){const authorized=productStatus(state,t.key).authorized;
  if(!authorized){blocked.push({...t,reason:'SIN ENVIAR NI COMPRAR'});continue;}
  const sorted=Object.entries(t.by).sort((a,b)=>dOrder(a[0],b[0]));
  // Si afecta a varias tiendas y falta producto, no se elige arbitrariamente quién recibe menos.
  const partial=authorized<t.total-1e-8&&sorted.length>1;
  const specified=legacyShortage(state,t.key);
  if(partial&&!specified){
   needsReview.push({...t,authorized,reason:'REPARTO INSUFICIENTE: ELIGE CANTIDADES POR DESTINO'});
   // Las bajadas ya hechas no desaparecen porque después aumenten un pedido.
   // Se mantienen únicamente esos mínimos y la disponibilidad libre queda
   // pendiente de distribuir manualmente, nunca se reparte a otra tienda.
   const physical=sorted.map(([dest,demand])=>({dest,demand,delivered:deliveredFor(state,t.key,dest)}));
   const taken=fix(physical.reduce((sum,x)=>sum+x.delivered,0));
   if(taken<=authorized+1e-8){
    for(const {dest,demand,delivered} of physical){
     if(delivered>0)eligible.push({key:t.key,dest,product:t.product,unit:t.unit,
      requested:demand,allowed:delivered,delivered,remaining:0});
     if(delivered<demand)short.push({key:t.key,dest,product:t.product,missing:fix(demand-delivered),unit:t.unit});
    }
   }
   continue;
  }
  let left=authorized;
  for(const [dest,demand] of sorted){const proposal=partial?fix(specified[dest]||0):demand;const allowed=fix(Math.min(demand,left,proposal));
   if(allowed>0){const delivered=deliveredFor(state,t.key,dest);eligible.push({key:t.key,dest,product:t.product,unit:t.unit,requested:demand,allowed,delivered,remaining:fix(Math.max(0,allowed-delivered))});}
   if(allowed<demand)short.push({key:t.key,dest,product:t.product,missing:fix(demand-allowed),unit:t.unit});
   left=fix(Math.max(0,left-allowed));}
 }
 return {eligible:eligible.sort((a,b)=>dOrder(a.dest,b.dest)||a.product.localeCompare(b.product,'es',{numeric:true})),blocked,short,needsReview};
}

function deliver(state,key,dest,q=null){const row=deliveryPlan(state).eligible.find(r=>r.key===key&&r.dest===dest);if(!row)throw Error('Producto no habilitado para reparto');const add=q===null?row.remaining:num(q);if(!(add>0)||add>row.remaining+1e-8)throw Error('Cantidad superior al reparto habilitado');const k=key+'@'+dest;state.delivery[k]=fix((state.delivery[k]||0)+add);return state.delivery[k];}
function undoDelivery(state,key,dest){for(const location of Object.keys(state.delivery||{})){const at=location.lastIndexOf('@');if(at>=0&&location.slice(at+1)===dest&&sameProductKey(state,location.slice(0,at),key))delete state.delivery[location];}}

/** Progreso de bajada por destino, ponderado por cantidades realmente habilitadas.
 * No mezcla tiendas y nunca cuenta productos sin compra/envío como bajados.
 */
function deliveryProgress(state,dest){
 // El progreso incluye TODO el pedido de la tienda, también lo que aún
 // falta comprar o repartir. Evita enseñar 100 % con cajas todavía faltantes.
 // Cada producto pesa una fila; nunca se suman bultos, kilos y manojos.
 const rows=totals(state).filter(x=>(x.by[dest]||0)>0);
 const total=rows.length;
 const bajado=fix(rows.reduce((sum,r)=>sum+Math.min(1,deliveredFor(state,r.key,dest)/(r.by[dest]||1)),0));
 const completos=rows.filter(r=>deliveredFor(state,r.key,dest)+1e-8>=r.by[dest]).length;
 const pendientes=total-completos;
 return {total,bajado,restante:fix(Math.max(0,total-bajado)),
   porcentaje:total>0?Math.min(100,Math.round(bajado/total*100)):0,
   productos:rows.length,completos,pendientes};
}

/** Mutación segura para una transacción Firebase: compara la fila VISIBLE con la
 * última fila de la nube. Dos personas no pueden tickar dos veces lo mismo.
 * Devuelve changed=false SIN modificar el estado cuando hay cambio concurrente.
 */
function applyDeliveryMutation(state,{action,key,dest,quantity=null,expectedDelivered,expectedAllowed,day,historyLength}){
 if(state.day!==day||((state.history||[]).length)!==historyLength)
  return {changed:false,code:'JORNADA_CAMBIADA'};
 const row=deliveryPlan(state).eligible.find(r=>r.key===key&&r.dest===dest);
 if(!row)return {changed:false,code:'NO_HABILITADO'};
 if(!Number.isFinite(Number(expectedDelivered))||Math.abs(row.delivered-Number(expectedDelivered))>1e-8)
  return {changed:false,code:'MODIFICADO_POR_OTRO'};
 if(!Number.isFinite(Number(expectedAllowed))||Math.abs(row.allowed-Number(expectedAllowed))>1e-8)
  return {changed:false,code:'CANTIDAD_ACTUALIZADA'};
 if(action==='bajar'){
  if(row.remaining<=1e-8)return {changed:false,code:'YA_BAJADO'};
  const amount=quantity===null?row.remaining:num(quantity);
  if(!Number.isFinite(amount)||amount<=0)return {changed:false,code:'CANTIDAD_INVALIDA'};
  if(amount>row.remaining+1e-8)return {changed:false,code:'CANTIDAD_INSUFICIENTE'};
  deliver(state,key,dest,amount);
  return {changed:true,code:'BAJADO',cantidad:fix(amount)};
 }
 if(action==='deshacer'){
  if(row.delivered<=1e-8)return {changed:false,code:'YA_DESHECHO'};
  undoDelivery(state,key,dest);
  return {changed:true,code:'DESHECHO',cantidad:fix(row.delivered)};
 }
 return {changed:false,code:'ACCION_DESCONOCIDA'};
}

function loadItem(state,key,dest,q){state.load[key+'@'+dest]=fix(q);}
function surplus(state){const out=[];for(const t of totals(state)){const extra=fix(Math.max(0,actuallyReceived(state,t.key)-t.total));if(extra>0)out.push({...t,extra});}return out;}
function distributeSurplus(extra,{fractional=false}={}){

/** Bajadas de un toque con verificación atómica en la versión más reciente.
 * Una operación concurrente sobre la misma fila no se aplica dos veces.
 */
/** Cada + / − guarda directamente: nunca marca como comprado el incremento. */
async function changeDemandOneTap(key,dest,rawDelta){
 if(deliveryBusy)throw Error('Ya hay un cambio en curso. Comprueba la lista.');
 const row=totals(state).find(r=>r.key===key);
 if(!row)throw Error('Producto no encontrado; actualiza Compras');
 const delta=Number(String(rawDelta).replace(',','.'));
 if(!Number.isFinite(delta)||delta===0)throw Error('Cantidad inválida');
 const expected=row.by[dest]||0;
 if(!CLOUD_ENABLED){
  const result=adjustDestinationDemand(state,key,dest,delta,{expectedQuantity:expected,day:state.day,historyLength:state.history.length});
  if(result.changed)commit(''); // El total visible cambia sin insertar avisos que muevan las filas del iPhone
  else{toastMessage='Sin cambios';render();}
  return;
 }
 if(!cloudAdapter||!cloudEngine||!cloudUser||cloudStatus!=='sincronizado'||cloudEngine.dirty||cloudEngine.conflict)
  throw Error('La nube debe estar SINCRONIZADA para cambiar cantidades del equipo. No se ha alterado el pedido.');
 if(typeof navigator!=='undefined'&&!navigator.onLine)
  throw Error('Sin internet. No se ha actualizado el pedido compartido.');
 const operation={key,dest,delta,expectedQuantity:expected,day:state.day,historyLength:(state.history||[]).length};
 deliveryBusy=true;toastMessage='';render();
 try{
  const result=await cloudAdapter.mutateDemand(operation);
  if(!result?.document)throw Error('Firebase no confirmó la cantidad; no se hizo ningún cambio local');
  if(!cloudEngine.dirty&&!cloudEngine.conflict)cloudEngine.applyConfirmedDocument(result.document);
  else await cloudEngine.refresh();
  toastMessage=result.changed?'':
   result.code==='MODIFICADO_POR_OTRO'?'Otra persona actualizó este producto. Ya ves la cantidad nueva.':
   result.code==='JORNADA_CAMBIADA'?'La jornada ha cambiado. No se modificó la cantidad.':
   'No se modificó el producto; revisa la cantidad actual.';
 }finally{deliveryBusy=false;render();}
}

async function processDeliveryClick(action,key,dest,qty=null){
 if(deliveryBusy){toastMessage='Ya se está guardando otra bajada. Comprueba su resultado.';render();return;}
 const row=deliveryPlan(state).eligible.find(x=>x.key===key&&x.dest===dest);
 if(!row)throw Error('Producto no disponible para bajar. Actualiza el reparto.');
 if(!CLOUD_ENABLED){
  if(action==='deshacer')undoDelivery(state,key,dest);
  else deliver(state,key,dest,qty);
  commit(action==='deshacer'?'Bajada deshecha':'Bajada guardada en este dispositivo');
  return;
 }
 if(!cloudAdapter||!cloudEngine||!cloudUser||cloudStatus!=='sincronizado'||cloudEngine.dirty||cloudEngine.conflict)
  throw Error('Conecta Firebase y espera a que el estado sea SINCRONIZADO antes de bajar. No se ha marcado nada.');
 if(typeof navigator!=='undefined'&&!navigator.onLine)
  throw Error('Sin conexión. Para evitar duplicados, las bajadas compartidas requieren confirmar Firebase.');
 deliveryBusy=true;toastMessage='Confirmando bajada con Firebase…';render();
 try{
  const op={action,key,dest,quantity:qty,expectedDelivered:row.delivered,expectedAllowed:row.allowed,
   day:state.day,historyLength:(state.history||[]).length};
  const result=await cloudAdapter.mutateDelivery(op);
  if(!result?.document)throw Error('Firebase no ha confirmado el estado actual');
  if(!cloudEngine.dirty&&!cloudEngine.conflict)cloudEngine.applyConfirmedDocument(result.document);
  else await cloudEngine.refresh();
  const reason={MODIFICADO_POR_OTRO:'Ya lo cambió otra persona; lista actualizada sin duplicar la bajada.',
   YA_BAJADO:'Ya estaba bajado. La lista se ha actualizado.',JORNADA_CAMBIADA:'Se ha cambiado de jornada; no se guardó esta bajada.',
   CANTIDAD_ACTUALIZADA:'Otro usuario cambió la cantidad disponible; revisa la lista.',
   NO_HABILITADO:'La mercancía ya no está habilitada para repartir.'};
  toastMessage=result.changed?
   (action==='deshacer'?'Bajada deshecha y sincronizada con el equipo':'Bajada confirmada en Firebase · progreso actualizado'):
   (reason[result.code]||'Otro repartidor cambió esta línea. Comprueba la lista.');
 }finally{deliveryBusy=false;render();}
}

 case 'shortage':{const r=deliveryPlan(state).needsReview.find(x=>x.key===key);if(!r)return;const inputs={};let available=r.authorized;for(const [d,need] of Object.entries(r.by)){
   const v=prompt(`${r.product}: hay ${available} para repartir. ¿Cuánto reservar para ${destName(d)}? (pidió ${need})`,String(Math.min(need,available)));
   if(v===null)return;const n=Number(v.replace(',','.'));inputs[d]=n;available=fix(available-n);
  }
  planShortage(state,key,inputs);commit('Reparto de compra parcial confirmado');return;}
 case 'extra':{const r=surplus(state).find(x=>x.key===key);if(!r)return;const q=distributeSurplus(r.extra);alert(`Propuesta sobre el EXTRA de ${r.extra} ${r.unit}:\nSAN PABLO ${q.SP}\nSAN LESMES ${q.SL}\nSANTIAGO ${q.ST}\nEsta vista sólo audita el reparto; no añade líneas extra automáticamente.`);return;}
 case 'rider':{const n=prompt(`Repartidor de ${destName(key)}:`,state.riderAssignments?.[key]||'');if(n===null||!n.trim())return;assignRider(state,key,n);commit('Repartidor asignado');return;}
 case 'clearday':{const hasActivity=Boolean(state.orders.length||state.allocations.length||state.manual.length||state.receipts.length||Object.keys(state.delivery||{}).length||Object.keys(state.load||{}).length||Object.keys(state.shortageAllocation||{}).length||Object.keys(state.riderAssignments||{}).length||(state.sentMessages||[]).length);if(!hasActivity){toastMessage='Esta jornada ya está vacía. Puedes pegar pedidos nuevos.';render();return;}const confirmed=confirm('LIMPIAR DÍA\n\nSe archivarán los pedidos actuales, asignaciones, compras, envíos, carga y bajadas.\n\nSe conservan productos, restaurantes, proveedores, nombres aprendidos e historial.\n\nSe descargará primero una copia de esta jornada. ¿Continuar?');if(!confirmed)return;const token=prompt('Para evitar un borrado accidental escribe LIMPIAR:','');if(token!=='LIMPIAR')return;download('ARSLAN_LISTAS_ANTES_LIMPIAR_'+state.day+'.json',JSON.stringify(state,null,2),'application/json');const today=new Date();const d=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');newDay(state,d);tab='inicio';commit('Día limpiado y archivado. Ya puedes introducir pedidos nuevos; los productos y restaurantes siguen guardados.');return;}
 case 'newday':{if(!confirm('¿Archivar la jornada actual y empezar otra? Se descargará una copia antes de cambiar.'))return;download('ARSLAN_LISTAS_ANTES_NUEVO_DIA_'+state.day+'.json',JSON.stringify(state,null,2),'application/json');const today=new Date();const d=prompt('Fecha de la nueva jornada (AAAA-MM-DD):',[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-'));if(!d)return;newDay(state,d);tab='inicio';commit('Jornada nueva creada; catálogo y restaurantes conservados');return;}
 case 'export':download('ARSLAN_LISTAS_JORNADA_'+state.day+'.json',JSON.stringify(state,null,2),'application/json');return;
 default:return;}
 }catch(e){toastMessage='ERROR: '+(e?.message||String(e));render();}
}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.item[role=button][data-action=assign]')){e.preventDefault();handleAction('assign',dec(e.target.dataset.key),'','');}});
document.addEventListener('change',async e=>{
 if(e.target.id==='deliveryDestination'){selectedDeliveryDest=e.target.value;render();return;}
 if(e.target.id==='cloud-import-file'){
  try{
   if(!cloudEngine)throw Error('Debes iniciar sesión en Firebase primero');
   if(!['sincronizado','importar'].includes(cloudStatus))throw Error('Resuelve primero las sincronizaciones pendientes o conflictos');
   const file=e.target.files?.[0];if(!file)return;
   if(file.size>8_000_000)throw Error('Archivo demasiado grande; revisa la copia');
   const data=JSON.parse(await file.text());
   if(!data||typeof data!=='object'||!Array.isArray(data.orders)||!Array.isArray(data.destinations)||!Array.isArray(data.catalog)||typeof data.day!=='string')throw Error('No es una copia de jornada válida');
   if(state.orders.length||state.allocations?.length||state.manual?.length||Object.keys(state.delivery||{}).length)throw Error('Ya hay pedidos en la nube. No importamos encima: primero guarda copia y revisa la jornada');
   if(!confirm('¿Importar '+data.orders.length+' líneas desde el JSON? Se descargará primero una copia del estado actual.'))return;
   download('ARSLAN_LISTAS_ANTES_DE_IMPORTAR.json',JSON.stringify(state,null,2),'application/json');
   state=data;
   if(cloudStatus==='importar'){cloudEngine.apply(state);cloudEngine.hasLocal=true;cloudMessage='Copia cargada en este dispositivo. Pulsa SUBIR LOS DATOS para guardarla en Firebase.';render();}
   else commit('Copia importada; guardando en Firebase');
  }catch(err){toastMessage='ERROR AL IMPORTAR: '+(err?.message||err);render();}
 }
});
document.addEventListener('input',e=>{if(e.target.matches('[data-purchase-qty]'))purchaseDrafts[e.target.dataset.purchaseMode+':'+e.target.dataset.purchaseKey]=e.target.value;if(e.target.id==='searchRows'){const word=canonical(e.target.value);document.querySelectorAll('.searchable').forEach(el=>{el.hidden=!canonical(el.dataset.search).includes(word);});}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b.dataset.action,dec(b.dataset.key||''),b.dataset.target?dec(b.dataset.target):'',b.dataset.dest?dec(b.dataset.dest):'');}});
void bootCloud();</script></body></html>
